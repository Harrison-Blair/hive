<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive Logs screen with JSON panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 984px; height: 728px; box-sizing: border-box; padding: 24px; background: #171612; border-radius: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 17px; white-space: pre; color: #e6e1d6; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="40"><div style="height: 17px"><sc-for list="{{row.runs}}" as="run" hint-placeholder-count="1"><span style="display: inline-block; vertical-align: top; overflow: hidden; width: {{run.width}}; color: {{run.color}}; font-weight: {{run.weight}}">{{run.text}}</span></sc-for></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":984,"height":728}}'>
var PAL = {fg:'#e6e1d6', border:'#3d3a33', dim:'#a39d90', accent:'#f5b942', working:'#6ee69a', done:'#7ccf6a', info:'#6fb7ff'};
function T(w, h) { var g = []; for (var y = 0; y < h; y++) { var r = []; for (var x = 0; x < w; x++) r.push({c:' ', k:'fg', b:0}); g.push(r); } return {w:w, h:h, g:g}; }
function put(t, x, y, s, k, b) { s = String(s); for (var i = 0; i < s.length; i++) { var xx = x + i; if (y < 0 || y >= t.h || xx < 0 || xx >= t.w) continue; t.g[y][xx] = {c:s[i], k:k || 'fg', b:b ? 1 : 0}; } }
function rep(ch, n) { return n > 0 ? Array(n + 1).join(ch) : ''; }
function vline(t, x, y, n, ch, k) { for (var i = 0; i < n; i++) put(t, x, y + i, ch, k); }
function box(t, x, y, w, h, k, title, tk) { put(t, x, y, '╭' + rep('─', w - 2) + '╮', k); for (var i = 1; i < h - 1; i++) { put(t, x, y + i, '│', k); put(t, x + w - 1, y + i, '│', k); } put(t, x, y + h - 1, '╰' + rep('─', w - 2) + '╯', k); if (title) put(t, x + 2, y, ' ' + title + ' ', tk || 'accent', 1); }
function fit(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s + rep(' ', n - s.length); }
function rows(t) { var out = []; for (var y = 0; y < t.h; y++) { var runs = [], cur = null; for (var x = 0; x < t.w; x++) { var c = t.g[y][x], sym = c.c.charCodeAt(0) > 127; if (cur && !sym && !cur.sym && cur.k === c.k && cur.b === c.b) cur.text += c.c; else { cur = {text:c.c, k:c.k, b:c.b, sym:sym}; runs.push(cur); } } out.push({runs: runs.map(function (r) { return {text:r.text, color:PAL[r.k], weight:r.b ? '700' : '400', width:r.text.length + 'ch'}; })}); } return out; }
function frame(t, active, region, hints) {
  var w = t.w;
  put(t, 0, 0, ' hive  ~/source/hive', 'fg', 1);
  var right = 'coordinator ● working   supervisor ● live   ? 0 asks   needs you 0   14:22 ';
  var rx = w - right.length; put(t, rx, 0, right, 'fg', 1); put(t, rx + 12, 0, '●', 'working', 1); put(t, rx + 35, 0, '●', 'working', 1);
  put(t, 0, 2, rep('─', w), 'border');
  var names = ['Agents', 'Chat', 'Work', 'Friction', 'Health', 'Logs'], x = 1;
  names.forEach(function (n, i) { var lab = ' ' + (i + 1) + ' ' + n + ' '; if (i === active) { put(t, x, 1, lab, 'accent', 1); put(t, x, 2, rep('━', lab.length), 'accent'); } else put(t, x, 1, lab, 'dim'); x += lab.length + 1; });
  var tag = ' [' + region + '] ';
  put(t, 0, t.h - 1, tag, 'accent', 1); put(t, tag.length, t.h - 1, fit(hints, w - tag.length), 'dim');
}
function logs(t) {
  frame(t, 5, 'json', '↑↓ scroll · tab region · f follow · < > day · / filter · g/G top/end · ? help');
  box(t, 0, 3, 120, 3, 'border', 'filter', 'accent');
  put(t, 2, 4, '/', 'accent', 1); put(t, 4, 4, 'level:', 'dim'); put(t, 10, 4, 'debug', 'fg'); put(t, 16, 4, 'proj:', 'dim'); put(t, 21, 4, 'hive', 'fg');
  put(t, 84, 4, 'follow', 'dim'); put(t, 91, 4, '●', 'working'); put(t, 94, 4, '<', 'accent', 1); put(t, 96, 4, '2026-10-21', 'fg'); put(t, 107, 4, '>', 'accent', 1);
  box(t, 0, 6, 64, 33, 'border', 'events · 312', 'accent');
  var cyc = [['herdr', 'pane.read w58:p6 · 40ms'], ['task', 'status read 4-agents-equal-columns'], ['agent', 'list · 5 agents'], ['inbox', 'record read by manager-hive'], ['supervise', 'scan agents · 5 records']];
  var ev = [];
  for (var n = 0; n < 14; n++) { var sec = 13 * 3600 + 4 * 60 + 36 + 48 * n, hh = Math.floor(sec / 3600), mm = Math.floor(sec / 60) % 60, ss = sec % 60; ev.push([[hh, mm, ss].map(function (v) { return (v < 10 ? '0' : '') + v; }).join(':'), 'DEBUG', cyc[n % 5][0], cyc[n % 5][1]]); }
  ev = ev.concat([
    ['13:19:40', 'DEBUG', 'inbox', 'record sent to coordinator'],
    ['13:19:40', 'DEBUG', 'supervise', 'nudge coordinator · inbox 2'],
    ['13:21:02', 'DEBUG', 'agent', 'spawn worker t2-worker-1'],
    ['13:21:09', 'DEBUG', 'herdr', 'agent.start w5T:p1 · 812ms'],
    ['13:24:51', 'DEBUG', 'task', 'status assigned → working'],
    ['13:33:17', 'DEBUG', 'task', 'status working → completed'],
    ['13:33:18', 'DEBUG', 'agent', 'stop t2-worker-1 · pane closed'],
    ['13:33:40', 'DEBUG', 'agent', 'spawn verifier t2-verifier-1'],
    ['13:38:02', 'WARN', 'task', 'verify fail · V4 diff scope'],
    ['13:38:30', 'DEBUG', 'agent', 'spawn worker t2-worker-2'],
    ['13:44:12', 'DEBUG', 'task', 'status completed → verified'],
    ['13:44:20', 'DEBUG', 'land', 'merge task/2 into dev · 0e079272'],
    ['13:44:22', 'DEBUG', 'land', 'push dev · 1.9s'],
    ['13:44:23', 'DEBUG', 'worktree', 'remove 2-stale-coordinator-startup'],
    ['13:44:25', 'DEBUG', 'inbox', 'record sent to coordinator'],
    ['13:45:01', 'DEBUG', 'agent', 'spawn worker t3-worker-1']
  ]);
  ev.forEach(function (e, i) {
    var y = 8 + i, sel = i === 22;
    put(t, 2, y, sel ? '▶' : ' ', sel ? 'accent' : 'fg', sel ? 1 : 0);
    put(t, 4, y, e[0], sel ? 'accent' : 'dim');
    put(t, 13, y, fit(e[1], 6), e[1] === 'WARN' ? 'accent' : 'dim', e[1] === 'WARN' ? 1 : 0);
    put(t, 19, y, fit(e[2], 10), 'info');
    put(t, 29, y, fit(e[3], 33), sel ? 'accent' : 'fg', sel ? 1 : 0);
  });
  vline(t, 63, 36, 2, '┃', 'dim');
  box(t, 64, 6, 56, 33, 'accent', 'event 13:38:02', 'accent');
  var json = [['{', ''], ['  "time": ', '"2026-10-21T13:38:02.114Z",'], ['  "level": ', '"WARN",'], ['  "msg": ', '"verify fail",'], ['  "component": ', '"task",'], ['  "command": ', '"task verify",'], ['  "project_id": ', '"hive",'], ['  "task_id": ', '"2-stale-coordinator-startup",'], ['  "agent_id": ', '"t2-verifier-1",'], ['  "request_id": ', '"r-7f31c2",'], ['  "duration_ms": ', '412,'], ['  "items": ', '{'], ['    "V1": ', '"pass",'], ['    "V2": ', '"pass",'], ['    "V3": ', '"pass",'], ['    "V4": ', '"fail",'], ['    "V5": ', '"pass"'], ['  },', ''], ['  "reason": ', '"V4 diff scope; Design section missing",'], ['  "truncated": ', 'false'], ['}', '']];
  json.forEach(function (j, i) { var y = 8 + i; var key = j[0]; var m = key.match(/^(\s*)(".*?")(.*)$/); if (m) { put(t, 66, y, m[1], 'fg'); put(t, 66 + m[1].length, y, m[2], 'info'); put(t, 66 + m[1].length + m[2].length, y, m[3] + fit(j[1], 50 - key.length), 'fg'); } else put(t, 66, y, key + j[1], 'fg'); });
}
class Component extends DCLogic {
  renderVals() {
    var t = T(120, 40);
    logs(t);
    return { rows: rows(t) };
  }
}
</script>
</body>
</html>
