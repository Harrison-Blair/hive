<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive Friction screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 984px; height: 728px; box-sizing: border-box; padding: 24px; background: #171612; border-radius: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 17px; white-space: pre; color: #e6e1d6; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="40"><div style="height: 17px"><sc-for list="{{row.runs}}" as="run" hint-placeholder-count="1"><span style="display: inline-block; vertical-align: top; overflow: hidden; width: {{run.width}}; color: {{run.color}}; font-weight: {{run.weight}}">{{run.text}}</span></sc-for></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":984,"height":728}}'>
var PAL = {fg:'#e6e1d6', border:'#3d3a33', dim:'#a39d90', accent:'#f5b942', working:'#6ee69a', done:'#7ccf6a', info:'#6fb7ff'};
function T(w, h) { var g = []; for (var y = 0; y < h; y++) { var r = []; for (var x = 0; x < w; x++) r.push({c:' ', k:'fg', b:0}); g.push(r); } return {w:w, h:h, g:g}; }
function put(t, x, y, s, k, b) { s = String(s); for (var i = 0; i < s.length; i++) { var xx = x + i; if (y < 0 || y >= t.h || xx < 0 || xx >= t.w) continue; t.g[y][xx] = {c:s[i], k:k || 'fg', b:b ? 1 : 0}; } }
function rep(ch, n) { return n > 0 ? Array(n + 1).join(ch) : ''; }
function vline(t, x, y, n, ch, k) { for (var i = 0; i < n; i++) put(t, x, y + i, ch, k); }
function box(t, x, y, w, h, k, title, tk) { put(t, x, y, '╭' + rep('─', w - 2) + '╮', k); for (var i = 1; i < h - 1; i++) { put(t, x, y + i, '│', k); put(t, x + w - 1, y + i, '│', k); } put(t, x, y + h - 1, '╰' + rep('─', w - 2) + '╯', k); if (title) put(t, x + 2, y, ' ' + title + ' ', tk || 'accent', 1); }
function fit(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s + rep(' ', n - s.length); }
function rows(t) { var out = []; for (var y = 0; y < t.h; y++) { var runs = [], cur = null; for (var x = 0; x < t.w; x++) { var c = t.g[y][x], sym = c.c.charCodeAt(0) > 127; if (cur && !sym && !cur.sym && cur.k === c.k && cur.b === c.b) cur.text += c.c; else { cur = {text:c.c, k:c.k, b:c.b, sym:sym}; runs.push(cur); } } out.push({runs: runs.map(function (r) { return {text:r.text, color:PAL[r.k], weight:r.b ? '700' : '400', width:r.text.length + 'ch'}; })}); } return out; }
function frame(t, active, region, hints) {
  var w = t.w;
  put(t, 0, 0, ' hive  ~/source/hive', 'fg', 1);
  var right = 'coordinator ● working   supervisor ● live   needs you 0   14:22 ';
  var rx = w - right.length; put(t, rx, 0, right, 'fg', 1); put(t, rx + 12, 0, '●', 'working', 1); put(t, rx + 35, 0, '●', 'working', 1);
  put(t, 0, 2, rep('─', w), 'border');
  var names = ['Agents', 'Chat', 'Work', 'Friction', 'Health', 'Logs'], x = 1;
  names.forEach(function (n, i) { var lab = ' ' + (i + 1) + ' ' + n + ' '; if (i === active) { put(t, x, 1, lab, 'accent', 1); put(t, x, 2, rep('━', lab.length), 'accent'); } else put(t, x, 1, lab, 'dim'); x += lab.length + 1; });
  var tag = ' [' + region + '] ';
  put(t, 0, t.h - 1, tag, 'accent', 1); put(t, tag.length, t.h - 1, fit(hints, w - tag.length), 'dim');
}
function subtabs(t, y, names, active) {
  var x = 1;
  names.forEach(function (n, i) { var lab = i === active ? '[' + n + ']' : ' ' + n + ' '; put(t, x, y, lab, i === active ? 'accent' : 'dim', i === active ? 1 : 0); x += lab.length + 2; });
  put(t, t.w - 18, y, '[ ] switch view', 'dim');
}
function screen(t) {
  frame(t, 3, 'list', '↑↓ move · tab region · [ ] view · enter open · / filter · g/G top/end · ? help');
  subtabs(t, 3, ['Open', 'Resolved'], 0);
  box(t, 0, 4, 52, 35, 'accent', 'open · 15', 'accent');
  put(t, 2, 5, fit('ENTRY', 36) + 'OPENED', 'dim');
  var list = [['agent-send-flag-means-target', '10-21'], ['agent-can-send-user-chat', '10-20'], ['completed-task-cannot-reopen', '10-20'], ['local-gate-misses-ci-tidy', '10-20'], ['scratch-hive-starts-real-agents', '10-20'], ['ste-baseline-row-conflicts', '10-20'], ['verify-fail-lost-on-pass', '10-20'], ['worker-has-no-inbox', '10-20'], ['bypass-still-prompts-dangerous-rm', '10-19'], ['no-agent-dashboard', '10-19'], ['no-reviewer-role', '10-19'], ['nudge-interrupts-user-typing', '10-19'], ['old-features-lack-readme', '10-19'], ['verified-md-path-unspecified', '10-19'], ['worker-gate-adds-golangci-lint', '10-19']];
  list.forEach(function (r, i) {
    var y = 6 + i, sel = i === 4;
    put(t, 2, y, sel ? '▶' : ' ', 'accent', 1);
    put(t, 4, y, fit(r[0], 34), sel ? 'accent' : 'fg', sel ? 1 : 0);
    put(t, 38, y, r[1], 'dim');
  });
  box(t, 52, 4, 68, 35, 'border', 'scratch-hive-starts-real-agents', 'accent');
  var kv = [['title', 'Bare hive in a scratch home starts real tabs'], ['status', 'Open'], ['opened', '2026-10-20'], ['seen', '3 times · last 2026-10-21'], ['file', 'entries/scratch-hive-starts-real-agents.md']];
  kv.forEach(function (p, i) { put(t, 54, 6 + i, fit(p[0], 10), 'dim'); put(t, 64, 6 + i, fit(p[1], 54), i === 1 ? 'accent' : 'fg', i === 1 ? 1 : 0); });
  put(t, 54, 12, 'SUMMARY', 'accent', 1);
  var sum = ['Bare hive runs the startup of G9: in herdr, it starts a', 'coordinator and a supervisor in their own tabs when they are', 'missing. A worker or verifier that runs bare hive with', 'HIVE_HOME set to a scratch home gets no live coordinator and a', 'stale supervisor claim, so each run starts a new coordinator', 'tab and a new hive supervise process in the caller workspace.'];
  sum.forEach(function (s, i) { put(t, 54, 13 + i, s, 'fg'); });
  put(t, 54, 20, 'REPRODUCTION', 'accent', 1);
  var rep2 = ['1. In a herdr pane, make a scratch home with a marker.', '2. Run HIVE_HOME=<scratch> hive and quit the TUI.', '3. herdr tab list shows a new coordinator and supervisor tab.'];
  rep2.forEach(function (s, i) { put(t, 54, 21 + i, s, 'fg'); });
  put(t, 54, 25, 'OCCURRENCES', 'accent', 1);
  put(t, 54, 26, '2026-10-20  worker of 101 left 4 supervisors, 8 tabs', 'dim');
  put(t, 54, 27, '2026-10-20  t91-worker-1 closed the user TUI tab', 'dim');
  put(t, 54, 28, '2026-10-21  third scratch hive tab leak', 'dim');
  put(t, 54, 30, '↓ 12 more lines', 'dim');
  vline(t, 119, 6, 18, '┃', 'dim');
}
class Component extends DCLogic {
  renderVals() {
    var t = T(120, 40);
    screen(t);
    return { rows: rows(t) };
  }
}
</script>
</body>
</html>
