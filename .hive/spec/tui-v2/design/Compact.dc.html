<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive Work details overlay at 80 by 24</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 672px; height: 456px; box-sizing: border-box; padding: 24px; background: #171612; border-radius: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 17px; white-space: pre; color: #e6e1d6; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="24"><div style="height: 17px"><sc-for list="{{row.runs}}" as="run" hint-placeholder-count="1"><span style="display: inline-block; vertical-align: top; overflow: hidden; width: {{run.width}}; color: {{run.color}}; font-weight: {{run.weight}}">{{run.text}}</span></sc-for></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":672,"height":456}}'>
var PAL = {fg:'#e6e1d6', border:'#3d3a33', dim:'#a39d90', accent:'#f5b942', working:'#6ee69a', done:'#7ccf6a', info:'#6fb7ff'};
function T(w, h) { var g = []; for (var y = 0; y < h; y++) { var r = []; for (var x = 0; x < w; x++) r.push({c:' ', k:'fg', b:0}); g.push(r); } return {w:w, h:h, g:g}; }
function put(t, x, y, s, k, b) { s = String(s); for (var i = 0; i < s.length; i++) { var xx = x + i; if (y < 0 || y >= t.h || xx < 0 || xx >= t.w) continue; t.g[y][xx] = {c:s[i], k:k || 'fg', b:b ? 1 : 0}; } }
function rep(ch, n) { return n > 0 ? Array(n + 1).join(ch) : ''; }
function vline(t, x, y, n, ch, k) { for (var i = 0; i < n; i++) put(t, x, y + i, ch, k); }
function box(t, x, y, w, h, k, title, tk) { put(t, x, y, '╭' + rep('─', w - 2) + '╮', k); for (var i = 1; i < h - 1; i++) { put(t, x, y + i, '│', k); put(t, x + w - 1, y + i, '│', k); } put(t, x, y + h - 1, '╰' + rep('─', w - 2) + '╯', k); if (title) put(t, x + 2, y, ' ' + title + ' ', tk || 'accent', 1); }
function fit(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s + rep(' ', n - s.length); }
function rows(t) { var out = []; for (var y = 0; y < t.h; y++) { var runs = [], cur = null; for (var x = 0; x < t.w; x++) { var c = t.g[y][x], sym = c.c.charCodeAt(0) > 127; if (cur && !sym && !cur.sym && cur.k === c.k && cur.b === c.b) cur.text += c.c; else { cur = {text:c.c, k:c.k, b:c.b, sym:sym}; runs.push(cur); } } out.push({runs: runs.map(function (r) { return {text:r.text, color:PAL[r.k], weight:r.b ? '700' : '400', width:r.text.length + 'ch'}; })}); } return out; }
function frame(t, active, region, hints) {
  var w = t.w;
  put(t, 0, 0, ' hive', 'fg', 1);
  var right = 'coord ● · sup ● · needs you 0 · 14:22 ';
  var rx = w - right.length; put(t, rx, 0, right, 'fg', 1); put(t, rx + 6, 0, '●', 'working', 1); put(t, rx + 14, 0, '●', 'working', 1);
  put(t, 0, 2, rep('─', w), 'border');
  var names = ['Agents', 'Chat', 'Work', 'Friction', 'Health', 'Logs'], x = 1;
  names.forEach(function (n, i) { var lab = ' ' + (i + 1) + ' ' + n + ' '; if (i === active) { put(t, x, 1, lab, 'accent', 1); put(t, x, 2, rep('━', lab.length), 'accent'); } else put(t, x, 1, lab, 'dim'); x += lab.length; });
  var tag = ' [' + region + '] ';
  put(t, 0, t.h - 1, tag, 'accent', 1); put(t, tag.length, t.h - 1, fit(hints, w - tag.length), 'dim');
}
function compact(t) {
  frame(t, 2, 'details', '↑↓ scroll · esc back to list · b brief · v verified · d deps');
  put(t, 1, 3, ' Goals    Queue   ', 'dim'); put(t, 19, 3, '[Tasks]', 'accent', 1); put(t, 64, 3, 'list › details', 'dim');
  box(t, 0, 4, 80, 19, 'accent', '3-tui-restart · esc back', 'accent');
  var kv = [['status', 'landed'], ['goal', 'g1-tui-restart · wave B'], ['verifier', 't3-verifier-1 · pass'], ['merge', '3ccd93fb on dev']];
  kv.forEach(function (p, i) { put(t, 2, 5 + i, fit(p[0], 10), 'dim'); put(t, 12, 5 + i, fit(p[1], 64), i === 0 ? 'done' : 'fg'); });
  put(t, 2, 10, 'ACCEPTANCE', 'accent', 1);
  var ac = ['AC1 r restarts a coordinator or supervisor, confirms only when live', 'AC2 coordinator restart closes only a pane that hive started', 'AC3 supervisor restart runs hive supervise in a new tab', 'AC4 old records get stale or stopped, stay on disk, h hides them', 'AC5 header shows old and r to restart for an old supervisor', 'AC6 coordinator start waits for herdr readiness'];
  ac.forEach(function (s, i) { put(t, 2, 11 + i, '✓', 'done'); put(t, 4, 11 + i, fit(s, 72), 'fg'); });
  put(t, 2, 18, 'EVIDENCE', 'accent', 1);
  put(t, 2, 19, 'b', 'accent', 1); put(t, 4, 19, 'brief.md', 'fg'); put(t, 16, 19, 'v', 'accent', 1); put(t, 18, 19, 'VERIFIED.md', 'fg'); put(t, 32, 19, 'd', 'accent', 1); put(t, 34, 19, 'deps graph', 'fg');
  put(t, 2, 20, '↓ 3 more lines', 'dim');
  vline(t, 79, 5, 12, '┃', 'accent');
}
class Component extends DCLogic {
  renderVals() {
    var t = T(80, 24);
    compact(t);
    return { rows: rows(t) };
  }
}
</script>
</body>
</html>
