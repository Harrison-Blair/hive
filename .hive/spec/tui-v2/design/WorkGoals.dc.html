<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive Work screen, Goals view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 984px; height: 728px; box-sizing: border-box; padding: 24px; background: #171612; border-radius: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 17px; white-space: pre; color: #e6e1d6; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="40"><div style="height: 17px"><sc-for list="{{row.runs}}" as="run" hint-placeholder-count="1"><span style="display: inline-block; vertical-align: top; overflow: hidden; width: {{run.width}}; color: {{run.color}}; font-weight: {{run.weight}}">{{run.text}}</span></sc-for></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":984,"height":728}}'>
var PAL = {fg:'#e6e1d6', border:'#3d3a33', dim:'#a39d90', accent:'#f5b942', working:'#6ee69a', done:'#7ccf6a', info:'#6fb7ff', user:'#e9cf9b', code:'#9fd0ff'};
function T(w, h) { var g = []; for (var y = 0; y < h; y++) { var r = []; for (var x = 0; x < w; x++) r.push({c:' ', k:'fg', b:0}); g.push(r); } return {w:w, h:h, g:g}; }
function put(t, x, y, s, k, b) { s = String(s); for (var i = 0; i < s.length; i++) { var xx = x + i; if (y < 0 || y >= t.h || xx < 0 || xx >= t.w) continue; t.g[y][xx] = {c:s[i], k:k || 'fg', b:b ? 1 : 0}; } }
function segs(t, x, y, list) { list.forEach(function (s) { put(t, x, y, s[0], s[1] || 'fg', s[2]); x += s[0].length; }); }
function rep(ch, n) { return n > 0 ? Array(n + 1).join(ch) : ''; }
function vline(t, x, y, n, ch, k) { for (var i = 0; i < n; i++) put(t, x, y + i, ch, k); }
function box(t, x, y, w, h, k, title, tk) { put(t, x, y, '╭' + rep('─', w - 2) + '╮', k); for (var i = 1; i < h - 1; i++) { put(t, x, y + i, '│', k); put(t, x + w - 1, y + i, '│', k); } put(t, x, y + h - 1, '╰' + rep('─', w - 2) + '╯', k); if (title) put(t, x + 2, y, ' ' + title + ' ', tk || 'accent', 1); }
function fit(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s + rep(' ', n - s.length); }
function rows(t) { var out = []; for (var y = 0; y < t.h; y++) { var runs = [], cur = null; for (var x = 0; x < t.w; x++) { var c = t.g[y][x], sym = c.c.charCodeAt(0) > 127; if (cur && !sym && !cur.sym && cur.k === c.k && cur.b === c.b) cur.text += c.c; else { cur = {text:c.c, k:c.k, b:c.b, sym:sym}; runs.push(cur); } } out.push({runs: runs.map(function (r) { return {text:r.text, color:PAL[r.k], weight:r.b ? '700' : '400', width:r.text.length + 'ch'}; })}); } return out; }
function frame(t, active, region, hints) {
  var w = t.w, right, d1, d2;
  if (w >= 120) { put(t, 0, 0, ' hive  ~/source/hive', 'fg', 1); right = 'coordinator ● working   supervisor ● live   ? 0 asks   needs you 0   14:22 '; d1 = 12; d2 = 35; }
  else { put(t, 0, 0, ' hive', 'fg', 1); right = 'coord ● · sup ● · ? 0 · needs you 0 · 14:22 '; d1 = 6; d2 = 14; }
  var rx = w - right.length; put(t, rx, 0, right, 'fg', 1); put(t, rx + d1, 0, '●', 'working', 1); put(t, rx + d2, 0, '●', 'working', 1);
  put(t, 0, 2, rep('─', w), 'border');
  var names = ['Agents', 'Chat', 'Work', 'Friction', 'Health', 'Logs'], x = 1, gap = w >= 120 ? 1 : 0;
  names.forEach(function (n, i) { var lab = ' ' + (i + 1) + ' ' + n + ' '; if (i === active) { put(t, x, 1, lab, 'accent', 1); put(t, x, 2, rep('━', lab.length), 'accent'); } else put(t, x, 1, lab, 'dim'); x += lab.length + gap; });
  var tag = ' [' + region + '] ';
  put(t, 0, t.h - 1, tag, 'accent', 1); put(t, tag.length, t.h - 1, fit(hints, w - tag.length), 'dim');
}
function subtabs(t, y, names, active) {
  var x = 1;
  names.forEach(function (n, i) { var lab = i === active ? '[' + n + ']' : ' ' + n + ' '; put(t, x, y, lab, i === active ? 'accent' : 'dim', i === active ? 1 : 0); x += lab.length + 2; });
  put(t, t.w - 18, y, '[ ] switch view', 'dim');
}
function screen(t) {
  frame(t, 2, 'list', '↑↓ move · tab region · [ ] view · enter open · o design · t task · ? help');
  subtabs(t, 3, ['Goals', 'Queue', 'Tasks'], 0);
  box(t, 0, 4, 52, 35, 'accent', 'goals · 2', 'accent');
  put(t, 4, 5, fit('GOAL', 24) + fit('STATUS', 10) + 'WAVES', 'dim');
  var list = [['g2-tui-v2', 'planned', '0/5', 'info'], ['g1-tui-restart', 'done', '3/3', 'done']];
  list.forEach(function (r, i) {
    var y = 6 + i, sel = i === 1;
    put(t, 2, y, sel ? '▶' : ' ', sel ? 'accent' : 'fg', sel ? 1 : 0);
    put(t, 4, y, fit(r[0], 24), sel ? 'accent' : 'fg', sel ? 1 : 0);
    put(t, 28, y, fit(r[1], 10), r[3]);
    put(t, 38, y, r[2], 'dim');
  });
  box(t, 52, 4, 68, 35, 'border', 'g1-tui-restart', 'accent');
  var kv = [['title', 'TUI restart and stale coordinator startup'], ['status', 'done'], ['project', 'hive'], ['grant', 'grants.md 2026-10-18 hive delivery on dev'], ['manager', 'manager-hive']];
  kv.forEach(function (p, i) { put(t, 54, 6 + i, fit(p[0], 10), 'dim'); put(t, 64, 6 + i, fit(p[1], 54), i === 1 ? 'done' : 'fg'); });
  put(t, 54, 12, 'WAVES', 'accent', 1);
  put(t, 54, 13, fit('WAVE', 5) + fit('TITLE', 27) + fit('DONE WHEN', 11) + fit('LANDED', 8) + 'STATUS', 'dim');
  var w = [['A', 'Stale coordinator startup', 'dev', '1/1'], ['B', 'TUI restart', 'dev', '1/1'], ['C', 'Agents graph columns', 'dev', '1/1']];
  w.forEach(function (r, i) { var y = 14 + i; put(t, 54, y, fit(r[0], 4), 'accent', 1); put(t, 59, y, fit(r[1], 27), 'fg'); put(t, 86, y, fit(r[2], 11), 'fg'); put(t, 97, y, fit(r[3], 8), 'fg'); put(t, 105, y, '✓', 'done'); put(t, 107, y, 'done', 'done'); });
  put(t, 54, 18, 'TASKS', 'accent', 1);
  var tk = [['A', '2-stale-coordinator-startup', '0e079272'], ['B', '3-tui-restart', '3ccd93fb'], ['C', '4-agents-equal-columns', 'ede94f3e']];
  tk.forEach(function (r, i) { var y = 19 + i; put(t, 54, y, r[0], 'dim'); put(t, 58, y, fit(r[1], 30), 'fg'); put(t, 88, y, 'merge ' + r[2], 'dim'); });
  put(t, 54, 23, 'NEEDS YOU', 'accent', 1);
  put(t, 54, 24, 'nothing', 'dim');
  put(t, 54, 26, 'o', 'accent', 1); put(t, 56, 26, 'goal design', 'fg'); put(t, 70, 26, 't', 'accent', 1); put(t, 72, 26, 'open task in Tasks', 'fg');
}

class Component extends DCLogic {
  renderVals() {
    var t = T(120, 40);
    screen(t);
    return { rows: rows(t) };
  }
}
</script>
</body>
</html>
