<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive help overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 984px; height: 728px; box-sizing: border-box; padding: 24px; background: #171612; border-radius: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 17px; white-space: pre; color: #e6e1d6; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="40"><div style="height: 17px"><sc-for list="{{row.runs}}" as="run" hint-placeholder-count="1"><span style="display: inline-block; vertical-align: top; overflow: hidden; width: {{run.width}}; color: {{run.color}}; font-weight: {{run.weight}}">{{run.text}}</span></sc-for></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":984,"height":728}}'>
var PAL = {fg:'#e6e1d6', border:'#3d3a33', dim:'#a39d90', accent:'#f5b942', working:'#6ee69a', done:'#7ccf6a', info:'#6fb7ff'};
function T(w, h) { var g = []; for (var y = 0; y < h; y++) { var r = []; for (var x = 0; x < w; x++) r.push({c:' ', k:'fg', b:0}); g.push(r); } return {w:w, h:h, g:g}; }
function put(t, x, y, s, k, b) { s = String(s); for (var i = 0; i < s.length; i++) { var xx = x + i; if (y < 0 || y >= t.h || xx < 0 || xx >= t.w) continue; t.g[y][xx] = {c:s[i], k:k || 'fg', b:b ? 1 : 0}; } }
function rep(ch, n) { return n > 0 ? Array(n + 1).join(ch) : ''; }
function vline(t, x, y, n, ch, k) { for (var i = 0; i < n; i++) put(t, x, y + i, ch, k); }
function box(t, x, y, w, h, k, title, tk) { put(t, x, y, '╭' + rep('─', w - 2) + '╮', k); for (var i = 1; i < h - 1; i++) { put(t, x, y + i, '│', k); put(t, x + w - 1, y + i, '│', k); } put(t, x, y + h - 1, '╰' + rep('─', w - 2) + '╯', k); if (title) put(t, x + 2, y, ' ' + title + ' ', tk || 'accent', 1); }
function fit(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s + rep(' ', n - s.length); }
function rows(t) { var out = []; for (var y = 0; y < t.h; y++) { var runs = [], cur = null; for (var x = 0; x < t.w; x++) { var c = t.g[y][x], sym = c.c.charCodeAt(0) > 127; if (cur && !sym && !cur.sym && cur.k === c.k && cur.b === c.b) cur.text += c.c; else { cur = {text:c.c, k:c.k, b:c.b, sym:sym}; runs.push(cur); } } out.push({runs: runs.map(function (r) { return {text:r.text, color:PAL[r.k], weight:r.b ? '700' : '400', width:r.text.length + 'ch'}; })}); } return out; }
function frame(t, active, region, hints) {
  var w = t.w;
  put(t, 0, 0, ' hive  ~/source/hive', 'fg', 1);
  var right = 'coordinator ● working   supervisor ● live   needs you 0   14:22 ';
  var rx = w - right.length; put(t, rx, 0, right, 'fg', 1); put(t, rx + 12, 0, '●', 'working', 1); put(t, rx + 35, 0, '●', 'working', 1);
  put(t, 0, 2, rep('─', w), 'border');
  var names = ['Agents', 'Chat', 'Work', 'Friction', 'Health', 'Logs'], x = 1;
  names.forEach(function (n, i) { var lab = ' ' + (i + 1) + ' ' + n + ' '; if (i === active) { put(t, x, 1, lab, 'accent', 1); put(t, x, 2, rep('━', lab.length), 'accent'); } else put(t, x, 1, lab, 'dim'); x += lab.length + 1; });
  var tag = ' [' + region + '] ';
  put(t, 0, t.h - 1, tag, 'accent', 1); put(t, tag.length, t.h - 1, fit(hints, w - tag.length), 'dim');
}
function agents(t) {
  frame(t, 0, 'graph', '←↑↓→ move · enter details · a attach · p peek · t task · h hide stopped · ? help');
  box(t, 0, 3, 120, 36, 'accent', 'project agents', 'accent');
  box(t, 28, 5, 64, 16, 'border', 'hive', 'dim');
  function card(x, y, name, sub) { box(t, x, y, 24, 4, 'border'); put(t, x + 2, y + 1, name, 'fg'); put(t, x + 2, y + 2, sub, 'dim'); }
  card(48, 7, '◐ manager-hive', 'claude · idle · 4m');
  card(34, 14, '○ t4-worker-1', 'pi · stopped');
  card(64, 14, '○ t4-verifier-1', 'pi · stopped');
}
function help(t) {
  agents(t);
  for (var y = 0; y < t.h; y++) for (var x = 0; x < t.w; x++) { t.g[y][x].k = 'border'; t.g[y][x].b = 0; }
  var bx = 18, by = 6, bw = 84, bh = 29;
  for (var j = 0; j < bh; j++) put(t, bx, by + j, rep(' ', bw), 'fg');
  box(t, bx, by, bw, bh, 'accent', 'keys · ? or esc closes', 'accent');
  put(t, bx + 3, by + 2, 'GLOBAL · same on every screen', 'accent', 1);
  put(t, bx + 44, by + 2, 'ACTIONS · one meaning each', 'accent', 1);
  var g = [['1–6', 'switch screen'], ['tab', 'next region'], ['[ ]', 'previous / next view'], ['↑↓ j k', 'move'], ['←→', 'move on the graph'], ['pgup pgdn', 'page'], ['g G', 'top / end'], ['enter', 'open / details'], ['esc', 'back / close'], ['/', 'filter bar'], ['?', 'this help'], ['R', 'refresh now'], ['ctrl+c ×2', 'quit']];
  var a = [['a', 'attach to pane'], ['p', 'peek pane'], ['r', 'restart · Health › Agents'], ['h', 'hide stopped agents'], ['t', 'open task'], ['b', 'task brief'], ['v', 'VERIFIED.md'], ['d', 'dependency graph'], ['o', 'goal design'], ['s', 'stops only'], ['f', 'follow logs'], ['< >', 'previous / next day']];
  g.forEach(function (p, i) { put(t, bx + 3, by + 4 + i, fit(p[0], 11), 'accent', 1); put(t, bx + 14, by + 4 + i, p[1], 'fg'); });
  a.forEach(function (p, i) { put(t, bx + 44, by + 4 + i, fit(p[0], 6), 'accent', 1); put(t, bx + 50, by + 4 + i, p[1], 'fg'); });
  put(t, bx + 3, by + 19, 'FILTER FIELDS', 'accent', 1);
  put(t, bx + 3, by + 20, 'level:  comp:  proj:  agent:  task:  req:  text', 'fg');
  put(t, bx + 3, by + 21, 'example  / level:warn agent:manager-hive restart', 'dim');
  put(t, bx + 3, by + 23, 'CHAT', 'accent', 1);
  put(t, bx + 3, by + 24, 'i or enter types in chat · esc leaves the input · 1–6 work again', 'dim');
  put(t, bx + 3, by + 26, 'r restart: coordinator or supervisor, asks first only when live', 'dim');
  var tag = ' [help] ';
  put(t, 0, t.h - 1, rep(' ', t.w), 'dim');
  put(t, 0, t.h - 1, tag, 'accent', 1); put(t, tag.length, t.h - 1, '↑↓ scroll · ? or esc close', 'dim');
}
class Component extends DCLogic {
  renderVals() {
    var t = T(120, 40);
    help(t);
    return { rows: rows(t) };
  }
}
</script>
</body>
</html>
