<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive Logs details at 80 by 24</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 672px; height: 456px; box-sizing: border-box; padding: 24px; background: #171612; border-radius: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 17px; white-space: pre; color: #e6e1d6; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="24"><div style="height: 17px"><sc-for list="{{row.runs}}" as="run" hint-placeholder-count="1"><span style="display: inline-block; vertical-align: top; overflow: hidden; width: {{run.width}}; color: {{run.color}}; font-weight: {{run.weight}}">{{run.text}}</span></sc-for></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":672,"height":456}}'>
var PAL = {fg:'#e6e1d6', border:'#3d3a33', dim:'#a39d90', accent:'#f5b942', working:'#6ee69a', done:'#7ccf6a', info:'#6fb7ff', user:'#e9cf9b', code:'#9fd0ff'};
function T(w, h) { var g = []; for (var y = 0; y < h; y++) { var r = []; for (var x = 0; x < w; x++) r.push({c:' ', k:'fg', b:0}); g.push(r); } return {w:w, h:h, g:g}; }
function put(t, x, y, s, k, b) { s = String(s); for (var i = 0; i < s.length; i++) { var xx = x + i; if (y < 0 || y >= t.h || xx < 0 || xx >= t.w) continue; t.g[y][xx] = {c:s[i], k:k || 'fg', b:b ? 1 : 0}; } }
function segs(t, x, y, list) { list.forEach(function (s) { put(t, x, y, s[0], s[1] || 'fg', s[2]); x += s[0].length; }); }
function rep(ch, n) { return n > 0 ? Array(n + 1).join(ch) : ''; }
function vline(t, x, y, n, ch, k) { for (var i = 0; i < n; i++) put(t, x, y + i, ch, k); }
function box(t, x, y, w, h, k, title, tk) { put(t, x, y, '╭' + rep('─', w - 2) + '╮', k); for (var i = 1; i < h - 1; i++) { put(t, x, y + i, '│', k); put(t, x + w - 1, y + i, '│', k); } put(t, x, y + h - 1, '╰' + rep('─', w - 2) + '╯', k); if (title) put(t, x + 2, y, ' ' + title + ' ', tk || 'accent', 1); }
function fit(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s + rep(' ', n - s.length); }
function rows(t) { var out = []; for (var y = 0; y < t.h; y++) { var runs = [], cur = null; for (var x = 0; x < t.w; x++) { var c = t.g[y][x], sym = c.c.charCodeAt(0) > 127; if (cur && !sym && !cur.sym && cur.k === c.k && cur.b === c.b) cur.text += c.c; else { cur = {text:c.c, k:c.k, b:c.b, sym:sym}; runs.push(cur); } } out.push({runs: runs.map(function (r) { return {text:r.text, color:PAL[r.k], weight:r.b ? '700' : '400', width:r.text.length + 'ch'}; })}); } return out; }
function frame(t, active, region, hints) {
  var w = t.w, right, d1, d2;
  if (w >= 120) { put(t, 0, 0, ' hive  ~/source/hive', 'fg', 1); right = 'coordinator ● working   supervisor ● live   needs you 0   14:22 '; d1 = 12; d2 = 35; }
  else { put(t, 0, 0, ' hive', 'fg', 1); right = 'coord ● · sup ● · needs you 0 · 14:22 '; d1 = 6; d2 = 14; }
  var rx = w - right.length; put(t, rx, 0, right, 'fg', 1); put(t, rx + d1, 0, '●', 'working', 1); put(t, rx + d2, 0, '●', 'working', 1);
  put(t, 0, 2, rep('─', w), 'border');
  var names = ['Agents', 'Chat', 'Work', 'Friction', 'Health', 'Logs'], x = 1, gap = w >= 120 ? 1 : 0;
  names.forEach(function (n, i) { var lab = ' ' + (i + 1) + ' ' + n + ' '; if (i === active) { put(t, x, 1, lab, 'accent', 1); put(t, x, 2, rep('━', lab.length), 'accent'); } else put(t, x, 1, lab, 'dim'); x += lab.length + gap; });
  var tag = ' [' + region + '] ';
  put(t, 0, t.h - 1, tag, 'accent', 1); put(t, tag.length, t.h - 1, fit(hints, w - tag.length), 'dim');
}
function subtabs(t, y, names, active) {
  var x = 1;
  names.forEach(function (n, i) { var lab = i === active ? '[' + n + ']' : ' ' + n + ' '; put(t, x, y, lab, i === active ? 'accent' : 'dim', i === active ? 1 : 0); x += lab.length + 2; });
  put(t, t.w - 18, y, '[ ] switch view', 'dim');
}
function screen(t) {
  frame(t, 5, 'json', '↑↓ scroll · esc back to events · f follow');
  box(t, 0, 3, 80, 3, 'border', 'filter', 'accent');
  put(t, 2, 4, '/', 'accent', 1); put(t, 4, 4, 'level:', 'dim'); put(t, 10, 4, 'debug', 'fg'); put(t, 16, 4, 'proj:', 'dim'); put(t, 21, 4, 'hive', 'fg');
  put(t, 58, 4, '<', 'accent', 1); put(t, 60, 4, '2026-10-21', 'fg'); put(t, 71, 4, '>', 'accent', 1);
  box(t, 0, 6, 80, 17, 'accent', 'event 13:38:02 · esc back', 'accent');
  var json = [['{', ''], ['  "time": ', '"2026-10-21T13:38:02.114Z",'], ['  "level": ', '"WARN",'], ['  "msg": ', '"verify fail",'], ['  "component": ', '"task",'], ['  "command": ', '"task verify",'], ['  "project_id": ', '"hive",'], ['  "task_id": ', '"2-stale-coordinator-startup",'], ['  "agent_id": ', '"t2-verifier-1",'], ['  "request_id": ', '"r-7f31c2",'], ['  "duration_ms": ', '412,'], ['  "reason": ', '"V4 diff scope; Design section missing",'], ['  "truncated": ', 'false'], ['}', '']];
  json.forEach(function (j, i) { var y = 7 + i; var key = j[0]; var m = key.match(/^(\s*)(".*?")(.*)$/); if (m) { put(t, 2, y, m[1], 'fg'); put(t, 2 + m[1].length, y, m[2], 'info'); put(t, 2 + m[1].length + m[2].length, y, m[3] + j[1], 'fg'); } else put(t, 2, y, key + j[1], 'fg'); });
}

class Component extends DCLogic {
  renderVals() {
    var t = T(80, 24);
    screen(t);
    return { rows: rows(t) };
  }
}
</script>
</body>
</html>
